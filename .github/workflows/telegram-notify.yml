name: Telegram Notification

on:
  workflow_run:
    workflows: ["Android Release"]
    branches: [master]
    types:
      - completed

jobs:
  notify:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from October 19, 2026, which may
    # not ship the same Android SDK and Java setup. Move up once that's checked.
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Get Release Details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName > release_info.json
          TAG=$(jq -r .tagName release_info.json)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Send, unpin old, and pin new
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ env.TAG }}
          REPO: ${{ github.repository }}
        run: |
          LINK_16_MLKIT="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-16-plus-mlkit.apk"
          LINK_16_FOSS="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-16-plus-foss.apk"
          LINK_13_MLKIT="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-13-plus-mlkit.apk"
          LINK_13_FOSS="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-13-plus-foss-fdroid.apk"
          LINK_16_FOLDER="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-16-plus-mlkit-folder.apk"
          LINK_13_FOLDER="https://github.com/$REPO/releases/download/$TAG/atmo-engine-android-13-plus-mlkit-folder.apk"

          MESSAGE="🚀 <b>New Release: $TAG</b>

          ⬇️ <b>Click to Download:</b>
          • <a href=\"$LINK_16_MLKIT\">Android 16+ (ML Kit)</a>
          • <a href=\"$LINK_16_FOSS\">Android 16+ (FOSS)</a>
          • <a href=\"$LINK_13_MLKIT\">Android 13+ (ML Kit)</a>
          • <a href=\"$LINK_13_FOSS\">Android 13+ (FOSS/F-Droid)</a>
          • <a href=\"$LINK_16_FOLDER\">Android 16+ (ML Kit + folder playlists)</a>
          • <a href=\"$LINK_13_FOLDER\">Android 13+ (ML Kit + folder playlists)</a>"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
               -d chat_id="$CHAT_ID" \
               -d parse_mode="HTML" \
               -d disable_web_page_preview="true" \
               --data-urlencode "text=$MESSAGE")

          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id')
          
          echo "✅ Message sent. ID: $MESSAGE_ID"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/unpinAllChatMessages?chat_id=$CHAT_ID"
          echo "🗑️ Old pins removed."

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/pinChatMessage" \
               -d chat_id="$CHAT_ID" \
               -d message_id="$MESSAGE_ID"
          
          echo "📌 New release pinned!"
